  <text class="label" x="800" y="168">Updated</text>
  <line class="row" x1="84" y1="196" x2="940" y2="196"/>
  <line class="row" x1="84" y1="228" x2="940" y2="228"/>
  <line class="row" x1="84" y1="260" x2="940" y2="260"/>
  <line class="row" x1="84" y1="292" x2="940" y2="292"/>
  <rect x="96" y="204" width="240" height="8" fill="#cccccc" rx="2"/>
  <rect x="520" y="204" width="88" height="8" fill="#aaaaaa" rx="2"/>
  <rect x="800" y="204" width="80" height="8" fill="#aaaaaa" rx="2"/>
  <rect x="96" y="236" width="196" height="8" fill="#cccccc" rx="2"/>
  <rect x="520" y="236" width="78" height="8" fill="#aaaaaa" rx="2"/>
  <rect x="800" y="236" width="72" height="8" fill="#aaaaaa" rx="2"/>
  <rect x="96" y="268" width="252" height="8" fill="#cccccc" rx="2"/>
  <rect x="520" y="268" width="96" height="8" fill="#aaaaaa" rx="2"/>
  <rect x="800" y="268" width="84" height="8" fill="#aaaaaa" rx="2"/>
  <text class="wire-caption" x="480" y="612" text-anchor="middle">Wireframe S-03b - collapsed sidebar (~64px icon rail) with simple icon glyph placeholders.</text>
  <text class="wire-caption" x="480" y="628" text-anchor="middle">A shown only when Admin permitted; i = selection summary (full biblio when sidebar expanded).</text>
