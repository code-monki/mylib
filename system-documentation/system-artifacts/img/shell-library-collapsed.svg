<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <title>MyLib Shell - Library browse S-03 collapsed sidebar wireframe</title>
  <defs>
    <style><![CDATA[
      .bg { fill: #f0f0f0; }
      .sidebar { fill: #e4e4e4; stroke: #333333; stroke-width: 1.5; }
      .topbar { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
      .content { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
      .nav-item { fill: none; stroke: #888888; stroke-width: 1; }
      .nav-sel { fill: #d8d8d8; stroke: #333333; stroke-width: 1.5; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #222222; }
      .nav-glyph { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #111111; }
      .hint { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #666666; }
      .toolbar { fill: #fafafa; stroke: #bbbbbb; stroke-width: 1; }
      .row { fill: none; stroke: #cccccc; stroke-width: 1; }
      .wire-caption { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #444444; font-style: italic; }
    ]]></style>
  </defs>
  <rect class="bg" width="960" height="640"/>
  <!-- Icon rail 64px -->
  <rect class="sidebar" x="0" y="0" width="64" height="640"/>
  <text class="label" x="32" y="28" text-anchor="middle" font-size="10" font-weight="600">M</text>
