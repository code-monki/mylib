<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .text { fill: #000000; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 20px; }
      .title { fill: #000000; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 24px; font-weight: 700; }
      .note { fill: #000000; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 16px; }
      .line { fill: none; stroke: #000000; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1320" height="520" fill="#ffffff"/>
  <text class="title" x="660" y="42" text-anchor="middle">HLA Component Organization - Entry and Hosting</text>

  <rect class="box" x="140" y="96" width="360" height="72"/>
  <text class="text" x="320" y="140" text-anchor="middle">HLA-SHELL (Desktop UI)</text>

  <rect class="box" x="520" y="96" width="380" height="72"/>
  <text class="text" x="710" y="140" text-anchor="middle">HLA-CLIENT-ACCESS (API client / session / TLS)</text>

  <rect class="box" x="920" y="96" width="260" height="72"/>
  <text class="text" x="1050" y="140" text-anchor="middle">HLA-RELEASE</text>

  <rect class="box" x="520" y="272" width="380" height="72"/>
  <text class="text" x="710" y="316" text-anchor="middle">HLA-SERVER-HOST (process / listener / routing)</text>

  <line class="line" x1="500" y1="132" x2="520" y2="132" marker-end="url(#arrow)"/>
  <line class="line" x1="710" y1="168" x2="710" y2="272" marker-end="url(#arrow)"/>
  <line class="line" x1="320" y1="168" x2="1020" y2="96" marker-end="url(#arrow)"/>
  <line class="line" x1="900" y1="132" x2="920" y2="132" marker-end="url(#arrow)"/>

  <text class="note" x="660" y="404" text-anchor="middle">Output connector: HLA-SERVER-HOST -> Domain Services and Cross-Cutting diagram</text>
</svg>
