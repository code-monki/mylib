<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .text { fill: #000000; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 20px; }
      .title { fill: #000000; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 24px; font-weight: 700; }
      .note { fill: #000000; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 16px; }
      .line { fill: none; stroke: #000000; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1320" height="620" fill="#ffffff"/>
  <text class="title" x="660" y="42" text-anchor="middle">HLA Data Architecture - Audit and Reader Handoff</text>

  <rect class="box" x="80" y="120" width="300" height="64"/>
  <text class="text" x="230" y="160" text-anchor="middle">HLA-SECURITY</text>
  <rect class="box" x="430" y="120" width="300" height="64"/>
  <text class="text" x="580" y="160" text-anchor="middle">HLA-SERVER-HOST</text>
  <rect class="box" x="780" y="120" width="300" height="64"/>
  <text class="text" x="930" y="160" text-anchor="middle">HLA-SHELL</text>

  <rect class="box" x="120" y="320" width="300" height="64"/>
  <text class="text" x="270" y="360" text-anchor="middle">HLA-AUDIT</text>
  <rect class="box" x="820" y="320" width="300" height="64"/>
  <text class="text" x="970" y="360" text-anchor="middle">Native reader</text>
  <rect class="box" x="470" y="480" width="380" height="64"/>
  <text class="text" x="660" y="520" text-anchor="middle">HLA-STORAGE</text>

  <line class="line" x1="230" y1="184" x2="270" y2="320" marker-end="url(#arrow)"/>
  <line class="line" x1="580" y1="184" x2="270" y2="320" marker-end="url(#arrow)"/>
  <line class="line" x1="930" y1="184" x2="970" y2="320" marker-end="url(#arrow)"/>
  <line class="line" x1="970" y1="384" x2="660" y2="480" marker-end="url(#arrow)"/>

  <text class="note" x="660" y="586" text-anchor="middle">Input connectors: HLA-SECURITY and HLA-SERVER-HOST from Server Data Flows diagram</text>
</svg>
