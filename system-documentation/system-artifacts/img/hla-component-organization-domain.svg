  </defs>

  <rect x="0" y="0" width="1480" height="760" fill="#ffffff"/>
  <text class="title" x="740" y="42" text-anchor="middle">HLA Component Organization - Domain Service Flow</text>

  <rect class="box" x="560" y="84" width="360" height="64"/>
