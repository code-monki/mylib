  <text class="text" x="700" y="420" text-anchor="middle">HLA-SECURITY</text>

  <line class="line" x1="740" y1="148" x2="220" y2="220" marker-end="url(#arrow)"/>
  <line class="line" x1="740" y1="148" x2="540" y2="220" marker-end="url(#arrow)"/>
  <line class="line" x1="740" y1="148" x2="860" y2="220" marker-end="url(#arrow)"/>
  <line class="line" x1="740" y1="148" x2="1180" y2="220" marker-end="url(#arrow)"/>
  <line class="line" x1="220" y1="284" x2="380" y2="380" marker-end="url(#arrow)"/>
  <line class="line" x1="220" y1="284" x2="1180" y2="220" marker-end="url(#arrow)"/>
