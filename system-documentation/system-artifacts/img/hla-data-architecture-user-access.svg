<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .text { fill: #000000; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 20px; }
      .title { fill: #000000; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 24px; font-weight: 700; }
      .note { fill: #000000; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 16px; }
      .line { fill: none; stroke: #000000; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="520" fill="#ffffff"/>
  <text class="title" x="640" y="42" text-anchor="middle">HLA Data Architecture - User and Access Path</text>

  <rect class="box" x="120" y="110" width="220" height="64"/>
  <text class="text" x="230" y="150" text-anchor="middle">User</text>

  <rect class="box" x="390" y="110" width="240" height="64"/>
  <text class="text" x="510" y="150" text-anchor="middle">HLA-SHELL</text>

  <rect class="box" x="680" y="110" width="300" height="64"/>
  <text class="text" x="830" y="150" text-anchor="middle">HLA-CLIENT-ACCESS</text>

  <rect class="box" x="500" y="290" width="380" height="64"/>
  <text class="text" x="690" y="330" text-anchor="middle">HLA-SERVER-HOST</text>

  <line class="line" x1="340" y1="142" x2="390" y2="142" marker-end="url(#arrow)"/>
  <line class="line" x1="630" y1="142" x2="680" y2="142" marker-end="url(#arrow)"/>
  <line class="line" x1="830" y1="174" x2="690" y2="290" marker-end="url(#arrow)"/>

  <text class="note" x="640" y="472" text-anchor="middle">Output connector: HLA-SERVER-HOST -> Server Data Flows diagram</text>
</svg>
