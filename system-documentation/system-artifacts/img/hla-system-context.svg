  <path class="line" d="M 236 230 C 205 255, 170 285, 150 329" marker-end="url(#arrow)"/>
  <path class="line" d="M 300 230 C 331 255, 360 285, 376 329" marker-end="url(#arrow)"/>
  <path class="line" d="M 150 383 C 170 420, 210 460, 245 494" marker-end="url(#arrow)"/>
  <path class="line" d="M 376 383 C 356 420, 326 460, 291 494" marker-end="url(#arrow)"/>

  <rect x="62" y="284" width="140" height="24" fill="#ffffff" stroke="none"/>
