<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="536" height="630" viewBox="0 0 536 630">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
