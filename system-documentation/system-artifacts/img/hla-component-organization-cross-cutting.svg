<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .text { fill: #000000; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 20px; }
      .title { fill: #000000; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 24px; font-weight: 700; }
      .note { fill: #000000; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 16px; }
      .line { fill: none; stroke: #000000; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="560" fill="#ffffff"/>
  <text class="title" x="640" y="42" text-anchor="middle">HLA Component Organization - Audit and Observability</text>

  <rect class="box" x="100" y="120" width="300" height="64"/>
  <text class="text" x="250" y="160" text-anchor="middle">HLA-SECURITY</text>
  <rect class="box" x="460" y="120" width="300" height="64"/>
  <text class="text" x="610" y="160" text-anchor="middle">HLA-DOMAIN</text>
  <rect class="box" x="820" y="120" width="300" height="64"/>
  <text class="text" x="970" y="160" text-anchor="middle">HLA-SERVER-HOST</text>

  <rect class="box" x="260" y="320" width="300" height="64"/>
  <text class="text" x="410" y="360" text-anchor="middle">HLA-AUDIT</text>
  <rect class="box" x="720" y="320" width="360" height="64"/>
  <text class="text" x="900" y="360" text-anchor="middle">HLA-OBSLOG</text>

  <line class="line" x1="250" y1="184" x2="410" y2="320" marker-end="url(#arrow)"/>
  <line class="line" x1="610" y1="184" x2="410" y2="320" marker-end="url(#arrow)"/>
  <line class="line" x1="970" y1="184" x2="900" y2="320" marker-end="url(#arrow)"/>

  <text class="note" x="640" y="510" text-anchor="middle">Input connectors: HLA-SECURITY / HLA-DOMAIN / HLA-SERVER-HOST from Domain Service Flow diagram</text>
</svg>
