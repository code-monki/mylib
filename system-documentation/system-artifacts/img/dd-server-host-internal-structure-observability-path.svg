<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .text { fill: #000000; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 20px; }
      .title { fill: #000000; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 24px; font-weight: 700; }
      .line { fill: none; stroke: #000000; stroke-width: 2; }
      .note { fill: #000000; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 16px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="680" fill="#ffffff"/>
  <text class="title" x="640" y="42" text-anchor="middle">DD Server Host Internal Structure - Observability and Audit Paths</text>

  <rect class="box" x="150" y="100" width="360" height="64"/>
  <text class="text" x="330" y="139" text-anchor="middle">Request router</text>

  <rect class="box" x="770" y="100" width="360" height="64"/>
  <text class="text" x="950" y="139" text-anchor="middle">Lifecycle coordinator</text>

  <rect class="box" x="150" y="250" width="360" height="64"/>
  <text class="text" x="330" y="289" text-anchor="middle">Policy gateway adapter</text>

  <rect class="box" x="460" y="430" width="360" height="64"/>
  <text class="text" x="640" y="469" text-anchor="middle">Observability adapter</text>

  <rect class="box" x="920" y="430" width="220" height="64"/>
  <text class="text" x="1030" y="469" text-anchor="middle">Audit adapter</text>

  <line class="line" x1="330" y1="164" x2="330" y2="250" marker-end="url(#arrow)"/>
  <path class="line" d="M 330 164 C 330 280, 560 330, 640 430" marker-end="url(#arrow)"/>
  <line class="line" x1="950" y1="164" x2="640" y2="430" marker-end="url(#arrow)"/>
  <line class="line" x1="330" y1="314" x2="1030" y2="430" marker-end="url(#arrow)"/>
  <text class="note" x="640" y="642" text-anchor="middle">Input connectors: Request router / Policy gateway adapter from Request Path diagram</text>
</svg>
