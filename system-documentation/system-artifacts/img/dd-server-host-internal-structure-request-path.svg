<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .text { fill: #000000; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 20px; }
      .title { fill: #000000; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 24px; font-weight: 700; }
      .line { fill: none; stroke: #000000; stroke-width: 2; }
      .note { fill: #000000; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 16px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>
  <text class="title" x="600" y="42" text-anchor="middle">DD Server Host Internal Structure - Request Path</text>

  <rect class="box" x="440" y="84" width="320" height="64"/>
  <text class="text" x="600" y="123" text-anchor="middle">Listener manager</text>

  <rect class="box" x="440" y="214" width="320" height="64"/>
  <text class="text" x="600" y="253" text-anchor="middle">Request router</text>

  <rect class="box" x="440" y="344" width="320" height="64"/>
  <text class="text" x="600" y="383" text-anchor="middle">Policy gateway adapter</text>

  <rect class="box" x="440" y="474" width="320" height="64"/>
  <text class="text" x="600" y="513" text-anchor="middle">Domain service adapters</text>

  <line class="line" x1="600" y1="148" x2="600" y2="214" marker-end="url(#arrow)"/>
  <line class="line" x1="600" y1="278" x2="600" y2="344" marker-end="url(#arrow)"/>
  <line class="line" x1="600" y1="408" x2="600" y2="474" marker-end="url(#arrow)"/>
  <text class="note" x="600" y="578" text-anchor="middle">Input connector: Listener manager from Bootstrap diagram</text>
  <text class="note" x="600" y="602" text-anchor="middle">Output connectors: Request router and Policy gateway adapter -> Observability and Audit diagram</text>
</svg>
